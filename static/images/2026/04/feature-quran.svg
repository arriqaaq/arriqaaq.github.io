<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <fedropshadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"></fedropshadow>
    </filter>
  </defs>

  
  <rect x="20" y="20" width="660" height="260" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"></rect>

  
  <text x="350" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#1a1a2e" direction="rtl">
    ذَلِكَ الكِتَابُ لَا رَيْبَ فِيهِ هُدًى لِلمُتَّقِينَ
  </text>
  
  <text x="640" y="80" font-family="Georgia, serif" font-size="14" fill="#c8a96a">٢</text>

  
  <circle cx="248" cy="100" r="4" fill="#d4342a"></circle>
  <text x="258" y="104" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">Ghunna</text>
  <circle cx="318" cy="100" r="4" fill="#169777"></circle>
  <text x="328" y="104" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">Idgham</text>
  <circle cx="388" cy="100" r="4" fill="#4d80c6"></circle>
  <text x="398" y="104" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">Qalqala</text>

  
  <line x1="50" y1="118" x2="650" y2="118" stroke="#f0f1f3" stroke-width="1"></line>

  
  <text x="50" y="148" font-family="Georgia, serif" font-size="13" fill="#4a4a68">This is the Book about which there is no doubt, a guidance for those conscious of Allah -</text>

  
  <line x1="50" y1="168" x2="650" y2="168" stroke="#f0f1f3" stroke-width="1"></line>

  
  <text x="50" y="192" font-family="ui-monospace, monospace" font-size="11" fill="#9ca3af">2 : 2</text>
  
  <rect x="90" y="178" width="28" height="22" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"></rect>
  <text x="104" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4a4a68">▶</text>
  
  <rect x="124" y="178" width="28" height="22" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"></rect>
  <text x="138" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4a4a68">↓</text>
  
  <rect x="164" y="178" width="52" height="22" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"></rect>
  <text x="190" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">Words</text>
  <rect x="222" y="178" width="72" height="22" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"></rect>
  <text x="258" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">Show Tafsir</text>
  <rect x="300" y="178" width="64" height="22" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"></rect>
  <text x="332" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">Readings</text>
  <rect x="370" y="178" width="52" height="22" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"></rect>
  <text x="396" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">Similar</text>

  
  <rect x="50" y="212" width="600" height="52" rx="6" fill="#faf8f5"></rect>
  <text x="62" y="230" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#c8a96a">TAFSIR IBN KATHIR</text>
  <text x="62" y="250" font-family="Georgia, serif" font-size="11" fill="#6b7280">This is the Book of Allah, there is no doubt in it. It is a guidance for the pious believers,</text>
