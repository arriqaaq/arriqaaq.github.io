<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <fedropshadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"></fedropshadow>
    </filter>
  </defs>

  
  <rect x="20" y="20" width="140" height="460" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"></rect>
  <text x="40" y="50" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a2e">◆ Ilm</text>
  <line x1="30" y1="62" x2="150" y2="62" stroke="#f0f1f3" stroke-width="1"></line>
  <rect x="28" y="70" width="124" height="26" rx="6" fill="rgba(200,169,106,0.1)"></rect>
  <text x="42" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c8a96a">✦ Explore</text>
  <text x="42" y="114" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">◇ Ask</text>
  <line x1="30" y1="128" x2="150" y2="128" stroke="#f0f1f3" stroke-width="1"></line>
  <text x="42" y="148" font-family="system-ui, sans-serif" font-size="11" fill="#4a4a68">◈ Quran</text>
  <text x="42" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">☵ Hadiths</text>
  <text x="42" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">◎ Narrators</text>

  
  <rect x="170" y="20" width="610" height="460" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"></rect>

  
  <text x="200" y="58" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1a1a2e">Quran &amp; Sunnah</text>

  
  <rect x="200" y="72" width="340" height="30" rx="15" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"></rect>
  <text x="220" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">prayer</text>
  <rect x="560" y="74" width="50" height="24" rx="12" fill="#c8a96a"></rect>
  <text x="585" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">Hybrid</text>
  <rect x="616" y="74" width="56" height="24" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"></rect>
  <text x="644" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#9ca3af">Semantic</text>
  <rect x="678" y="74" width="50" height="24" rx="12" fill="#c8a96a"></rect>
  <text x="703" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#fff">Search</text>

  
  <text x="200" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#4a4a68">20 results</text>
  <text x="268" y="124" font-family="system-ui, sans-serif" font-size="10" fill="#c8a96a">21 from Quran  ·  21 from Hadith</text>

  
  <rect x="200" y="138" width="550" height="120" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"></rect>
  
  <rect x="694" y="142" width="50" height="18" rx="9" fill="rgba(200,169,106,0.1)"></rect>
  <text x="719" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#c8a96a">QURAN</text>
  
  <text x="738" y="182" text-anchor="end" font-family="'Traditional Arabic', 'Noto Naskh Arabic', serif" font-size="18" fill="#1a1a2e">حَافِظُوا عَلَى الصَلَوَاتِ وَالصَلَاةِ الْوُسْطَىٰ</text>
  
  <text x="210" y="210" font-family="Georgia, serif" font-size="11" fill="#6b7280">Maintain with care the [obligatory] prayers and [in particular] the middle prayer</text>
  <text x="210" y="226" font-family="Georgia, serif" font-size="11" fill="#6b7280">and stand before Allah, devoutly obedient.</text>
  
  <text x="210" y="250" font-family="ui-monospace, monospace" font-size="10" fill="#9ca3af">2:238</text>
  <rect x="248" y="237" width="24" height="18" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"></rect>
  <text x="260" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">▶</text>

  
  <rect x="200" y="270" width="550" height="130" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"></rect>
  <text x="210" y="292" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#1a1a2e">Book 3</text>
  <text x="260" y="292" font-family="ui-monospace, monospace" font-size="10" fill="#9ca3af">#215</text>
  <rect x="694" y="274" width="50" height="18" rx="9" fill="rgba(200,169,106,0.08)"></rect>
  <text x="719" y="287" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#c8a96a">HADITH</text>
  
  <rect x="210" y="300" width="120" height="20" rx="10" fill="rgba(200,169,106,0.08)"></rect>
  <text x="270" y="314" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#c8a96a">Abu Sa'eed al-Khudri</text>
  
  <text x="738" y="346" text-anchor="end" font-family="'Traditional Arabic', 'Noto Naskh Arabic', serif" font-size="16" fill="#1a1a2e">فَإِذَا قَضَيْتُمُ الصَلَاةَ فَاذْكُرُوا اللَّهَ</text>
  
  <text x="210" y="376" font-family="Georgia, serif" font-size="11" fill="#6b7280">And when you have completed the prayer, remember Allah standing, sitting,</text>
  <text x="210" y="392" font-family="Georgia, serif" font-size="11" fill="#6b7280">or [lying] on your sides. But when you become secure, re-establish prayer.</text>
</svg>
